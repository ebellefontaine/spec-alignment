<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="accentTop" cx="100%" cy="0%">
      <stop offset="0%" style="stop-color:rgba(14, 165, 233, 0.1);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(14, 165, 233, 0);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="accentBottom" cx="0%" cy="100%">
      <stop offset="0%" style="stop-color:rgba(168, 85, 247, 0.08);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(168, 85, 247, 0);stop-opacity:1" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Background accents -->
  <circle cx="1100" cy="-100" r="200" fill="url(#accentTop)"/>
  <circle cx="-50" cy="550" r="150" fill="url(#accentBottom)"/>

  <!-- Code box -->
  <g transform="translate(200, 315)">
    <rect x="-40" y="-40" width="80" height="80" rx="12" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="40" font-weight="700" fill="#0ea5e9">{ }</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui" font-size="14" fill="#cbd5e1" font-weight="500">Code</text>
  </g>

  <!-- Checkmark circle -->
  <g transform="translate(600, 315)">
    <defs>
      <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
      </linearGradient>
      <filter id="checkShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2" flood-color="#10b981"/>
      </filter>
    </defs>
    <circle cx="0" cy="0" r="60" fill="url(#checkGradient)" filter="url(#checkShadow)"/>
    <path d="M -20 0 L -5 15 L 20 -10" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="85" text-anchor="middle" font-family="system-ui" font-size="14" fill="#cbd5e1" font-weight="500">Aligned</text>
  </g>

  <!-- Specs box -->
  <g transform="translate(1000, 315)">
    <rect x="-40" y="-40" width="80" height="80" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" font-size="40">📋</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui" font-size="14" fill="#cbd5e1" font-weight="500">Specs</text>
  </g>

  <!-- Title and description -->
  <text x="600" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9">spec-alignment</text>
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#cbd5e1" font-weight="400">LLM-powered validation of code against specifications</text>
</svg>